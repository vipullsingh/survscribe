<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812" style="background-color: #F8FAFC; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- ==================== ARTBOARD FRAME: 00_auth_login_forgot_password (375 × 812) ==================== -->
  <rect id="Background-Canvas" width="375" height="812" fill="#F8FAFC" />

  <!-- Layer: iOS Status Bar -->
  <g id="Status-Bar" transform="translate(24, 14)">
    <text id="Time" x="6" y="14" font-size="13" font-weight="700" fill="#0F172A">09:41</text>
    <g id="System-Icons" transform="translate(270, 4)" fill="#0F172A">
      <rect x="0" y="6" width="2.5" height="4" rx="0.5" />
      <rect x="4" y="4" width="2.5" height="6" rx="0.5" />
      <rect x="8" y="2" width="2.5" height="8" rx="0.5" />
      <rect x="12" y="0" width="2.5" height="10" rx="0.5" />
      <rect x="22" y="0" width="20" height="10" rx="2.5" fill="none" stroke="#0F172A" stroke-width="1.2" />
      <rect x="24" y="2" width="13" height="6" rx="1" fill="#059669" />
      <path d="M43 3.5 C43.5 3.5 44 4 44 5 L44 5 C44 6 43.5 6.5 43 6.5" fill="#0F172A" />
    </g>
  </g>

  <!-- Layer: Top Navigation Bar with Back Button -->
  <g id="Top-Navigation-Bar" transform="translate(24, 52)">
    <rect id="Back-Button-Bg" x="0" y="0" width="36" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <path id="Back-Arrow" d="M21 12 L15 18 L21 24" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    
    <text id="Nav-Title" x="48" y="23" font-size="15" font-weight="800" fill="#0F172A">Account Recovery</text>
  </g>

  <!-- Layer: Brand Emblem & Header -->
  <g id="Recovery-Header" transform="translate(24, 110)">
    <rect id="Icon-Bg" x="0" y="0" width="44" height="44" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
    <g id="Icon-Lock-Reset" transform="translate(14, 12)" stroke="#1E3A8A" stroke-width="1.6" fill="none">
      <rect x="0" y="6" width="16" height="12" rx="2" />
      <path d="M3 6 L3 3 C3 1.3 4.8 0 8 0 C11.2 0 13 1.3 13 3 L13 6" />
      <circle cx="8" cy="12" r="1.5" fill="#1E3A8A" />
    </g>

    <text id="Heading" x="0" y="74" font-size="20" font-weight="800" fill="#0F172A" letter-spacing="-0.4">Reset Your Password</text>
    <text id="Subheading-1" x="0" y="96" font-size="12" font-weight="400" fill="#64748B">Enter your registered work email address or mobile number.</text>
    <text id="Subheading-2" x="0" y="112" font-size="12" font-weight="400" fill="#64748B">We will send a secure password reset link or one-time verification code.</text>
  </g>

  <!-- Layer: Form Container Card -->
  <g id="Recovery-Form-Card" transform="translate(24, 252)" filter="url(#cardShadow)">
    <rect id="Card-Surface" x="0" y="0" width="327" height="236" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />

    <!-- Group: Universal Recovery Identifier -->
    <g id="Input-Group-Recovery-ID" transform="translate(16, 20)">
      <text id="Label-Recovery-ID" x="0" y="0" font-size="11.5" font-weight="700" fill="#0F172A">Registered Email or Mobile *</text>
      
      <rect id="Field-Recovery-Bg" x="0" y="6" width="295" height="44" rx="6" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="1.5" />
      
      <!-- Mail Glyph -->
      <g id="Icon-Mail" transform="translate(12, 18)" stroke="#1E3A8A" stroke-width="1.5" fill="none">
        <rect x="0" y="0" width="16" height="12" rx="2" />
        <path d="M0 1 L8 7 L16 1" />
      </g>
      
      <text id="Value-Recovery-ID" x="36" y="32" font-size="12.5" font-weight="600" fill="#0F172A">surveyor.sharma@lossadjuster.in</text>
    </g>

    <!-- Button: Send Reset Instructions -->
    <g id="Button-Send-Reset" transform="translate(16, 94)">
      <rect id="Btn-Reset-Bg" x="0" y="0" width="295" height="44" rx="6" fill="#1E3A8A" />
      <text id="Btn-Reset-Text" x="147" y="27" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Send Password Reset Link</text>
    </g>

    <!-- Button: Back to Sign In -->
    <g id="Button-Back-SignIn" transform="translate(16, 154)">
      <rect id="Btn-Back-Bg" x="0" y="0" width="295" height="40" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <text id="Btn-Back-Text" x="147" y="25" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Return to Surveyor Sign In</text>
    </g>
  </g>

  <!-- Layer: Security Verification Footnote -->
  <g id="Security-Footnote" transform="translate(24, 510)">
    <rect id="Footnote-Bg" x="0" y="0" width="327" height="64" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <g id="Icon-Shield" transform="translate(14, 20)" stroke="#059669" stroke-width="1.5" fill="none">
      <circle cx="8" cy="8" r="7" />
      <path d="M5 8 L7 10 L11 6" stroke-linecap="round" />
    </g>
    <text id="Footnote-Title" x="36" y="22" font-size="10.5" font-weight="700" fill="#0F172A">Identity Verification Mandate</text>
    <text id="Footnote-Desc-1" x="36" y="36" font-size="9.5" font-weight="500" fill="#64748B">For security, reset tokens are valid for 15 minutes.</text>
    <text id="Footnote-Desc-2" x="36" y="48" font-size="9.5" font-weight="500" fill="#64748B">Contact firm administrator if access cannot be recovered.</text>
  </g>

  <!-- Layer: iOS Home Indicator -->
  <rect id="Home-Indicator" x="122" y="796" width="130" height="4" rx="2" fill="#0F172A" opacity="0.8" />
</svg>
