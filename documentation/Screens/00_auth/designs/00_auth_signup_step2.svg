<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812" style="background-color: #F8FAFC; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Ultra-subtle, unboxed shadow for a premium feel -->
    <filter id="surfaceElevation" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.02" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.01" />
    </filter>
    <filter id="btnElevation" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1E3A8A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- ==================== ARTBOARD CANVAS ==================== -->
  <rect width="375" height="812" fill="#F8FAFC" />

  <!-- 1. iOS Native Status Bar -->
  <g transform="translate(24, 16)">
    <text x="4" y="14" font-size="13" font-weight="700" fill="#0F172A">09:41</text>
    <g transform="translate(270, 4)" fill="#0F172A">
      <rect x="0" y="6" width="2.5" height="4" rx="0.5" />
      <rect x="4" y="4" width="2.5" height="6" rx="0.5" />
      <rect x="8" y="2" width="2.5" height="8" rx="0.5" />
      <rect x="12" y="0" width="2.5" height="10" rx="0.5" />
      <rect x="22" y="0" width="20" height="10" rx="2.5" fill="none" stroke="#0F172A" stroke-width="1.2" />
      <rect x="24" y="2" width="13" height="6" rx="1" fill="#059669" />
      <path d="M43 3.5 C43.5 3.5 44 4 44 5 L44 5 C44 6 43.5 6.5 43 6.5" />
    </g>
  </g>

  <!-- 2. Brand Header -->
  <g transform="translate(24, 60)">
    <!-- Row 1: Logo & Name -->
    <rect width="36" height="36" rx="8" fill="#1E3A8A" />
    <path d="M18 7 C24 7 28 10.5 28 16.5 C28 24 21.5 29 18 32 C14.5 29 8 24 8 16.5 C8 10.5 12 7 18 7 Z" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <path d="M14 17.5 L17 20.5 L22 14" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="48" y="24" font-size="20" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Surv<tspan fill="#1E3A8A">Scribe</tspan></text>
    
    <!-- Row 2: Subtitle -->
    <text y="52" font-size="9" font-weight="700" fill="#64748B" letter-spacing="0.5">INSURANCE SURVEY &amp; LOSS ASSESSMENT</text>
    
    <!-- Row 3: Security Badge -->
    <g transform="translate(0, 64)">
      <circle cx="3" cy="4" r="3" fill="#10B981" />
      <text x="12" y="8" font-size="10.5" font-weight="500" fill="#64748B">Secure workspace</text>
    </g>
  </g>

  <!-- 3. Page Introduction -->
  <g transform="translate(24, 156)">
    <text y="16" font-size="22" font-weight="800" fill="#0F172A" letter-spacing="-0.4">Register as Surveyor</text>
    <text y="40" font-size="13" font-weight="500" fill="#475569">
      Step 2 of 2: <tspan font-weight="400">SLA Credentials &amp; Security</tspan>
    </text>
  </g>

  <!-- Progress Bar (Step 2 of 2) -->
  <g transform="translate(24, 212)">
    <rect width="163" height="4" rx="2" fill="#1E3A8A" />
    <rect x="165" width="162" height="4" rx="2" fill="#1E3A8A" />
  </g>

  <!-- 4. Registration Card (Step 2) -->
  <g transform="translate(24, 236)" filter="url(#surfaceElevation)">
    <!-- Card Container Height: 488px -->
    <rect width="327" height="488" rx="10" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5" />

    <!-- Row 1: SLA License & Category (Split 50/50) -->
    <g transform="translate(16, 16)">
      <!-- SLA License Number -->
      <g>
        <text font-size="12" font-weight="600" fill="#334155">
          SLA License
        </text>
        <rect y="8" width="140" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
        <text x="12" y="35" font-size="13" font-weight="500" fill="#0F172A">SLA-10294</text>
      </g>
      
      <!-- SLA Category -->
      <g transform="translate(152, 0)">
        <text font-size="12" font-weight="600" fill="#334155">
          Category
        </text>
        <rect y="8" width="143" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
        <text x="12" y="35" font-size="13" font-weight="500" fill="#0F172A">Fellow</text>
        <path d="M120 28 L125 33 L130 28" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- Row 2: Base Location -->
    <g transform="translate(16, 88)">
      <text font-size="12" font-weight="600" fill="#334155">
        Operating Territory
      </text>
      <rect y="8" width="295" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <!-- Map Pin Icon -->
      <g transform="translate(14, 20)" stroke="#64748B" stroke-width="1.5" fill="none">
        <path d="M5 14 C5 14 0 9.5 0 6 C0 2.5 3 0 7 0 C11 0 14 2.5 14 6 C14 9.5 10 14 10 14" />
        <circle cx="7" cy="6" r="2.5" />
      </g>
      <text x="38" y="35" font-size="13" font-weight="500" fill="#0F172A">Mumbai, Maharashtra</text>
    </g>

    <!-- Row 3: Create Password -->
    <g transform="translate(16, 160)">
      <text font-size="12" font-weight="600" fill="#334155">
        Create Password <tspan fill="#DC2626">*</tspan>
      </text>
      <rect y="8" width="295" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <!-- Lock Icon -->
      <g transform="translate(12, 22)" stroke="#64748B" stroke-width="1.5" fill="none">
        <rect x="0" y="5" width="14" height="10" rx="2" />
        <path d="M3 5 L3 2.5 C3 1.1 4.8 0 7 0 C9.2 0 11 1.1 11 2.5 L11 5" />
      </g>
      <!-- Password dots -->
      <g transform="translate(38, 32)" fill="#0F172A">
        <circle cx="0" cy="0" r="2.5" />
        <circle cx="8" cy="0" r="2.5" />
        <circle cx="16" cy="0" r="2.5" />
        <circle cx="24" cy="0" r="2.5" />
        <circle cx="32" cy="0" r="2.5" />
        <circle cx="40" cy="0" r="2.5" />
        <circle cx="48" cy="0" r="2.5" />
        <circle cx="56" cy="0" r="2.5" />
        <circle cx="64" cy="0" r="2.5" />
        <circle cx="72" cy="0" r="2.5" />
      </g>
      <!-- Eye Icon -->
      <g transform="translate(266, 23)" stroke="#64748B" stroke-width="1.5" fill="none">
        <path d="M0 6 C3 2 7 2 10 6 C7 10 3 10 0 6 Z" />
        <circle cx="5" cy="6" r="1.8" />
      </g>
    </g>

    <!-- Row 4: Password Strength Meter -->
    <g transform="translate(16, 218)">
      <rect width="90" height="4" rx="2" fill="#10B981" />
      <rect x="94" width="90" height="4" rx="2" fill="#10B981" />
      <rect x="188" width="90" height="4" rx="2" fill="#E2E8F0" />
      <text x="295" y="7" font-size="9" font-weight="700" fill="#10B981" text-anchor="end">Good</text>
    </g>

    <!-- Row 5: Confirm Password -->
    <g transform="translate(16, 244)">
      <text font-size="12" font-weight="600" fill="#334155">
        Confirm Password <tspan fill="#DC2626">*</tspan>
      </text>
      <rect y="8" width="295" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <g transform="translate(12, 22)" stroke="#64748B" stroke-width="1.5" fill="none">
        <rect x="0" y="5" width="14" height="10" rx="2" />
        <path d="M3 5 L3 2.5 C3 1.1 4.8 0 7 0 C9.2 0 11 1.1 11 2.5 L11 5" />
      </g>
      <g transform="translate(38, 32)" fill="#0F172A">
        <circle cx="0" cy="0" r="2.5" />
        <circle cx="8" cy="0" r="2.5" />
        <circle cx="16" cy="0" r="2.5" />
        <circle cx="24" cy="0" r="2.5" />
        <circle cx="32" cy="0" r="2.5" />
        <circle cx="40" cy="0" r="2.5" />
        <circle cx="48" cy="0" r="2.5" />
        <circle cx="56" cy="0" r="2.5" />
        <circle cx="64" cy="0" r="2.5" />
        <circle cx="72" cy="0" r="2.5" />
      </g>
      <!-- Match check icon -->
      <g transform="translate(266, 21)" stroke="#10B981" stroke-width="1.8" fill="none">
        <path d="M2 7 L5 10 L10 3" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- Row 6: Terms & Privacy Policy Checkbox -->
    <g transform="translate(16, 316)">
      <rect width="16" height="16" rx="4" fill="#1E3A8A" />
      <path d="M4 8 L7 11 L12 4.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="26" y="12.5" font-size="11" font-weight="500" fill="#475569">
        I agree to the <tspan font-weight="700" fill="#1E3A8A">Terms</tspan> &amp; <tspan font-weight="700" fill="#1E3A8A">Privacy Policy</tspan>
      </text>
    </g>

    <!-- Row 7: Regulatory Disclaimer Card -->
    <g transform="translate(16, 352)">
      <rect width="295" height="48" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <g transform="translate(10, 14)" stroke="#64748B" stroke-width="1.5" fill="none">
        <circle cx="6" cy="6" r="6" />
        <path d="M6 3 V4.5 M6 6.5 V10" stroke-linecap="round" />
      </g>
      <text font-size="9" font-weight="500" fill="#64748B">
        <tspan x="28" y="21">License details are subject to independent verification.</tspan>
        <tspan x="28" y="35">Registration does not imply regulatory endorsement.</tspan>
      </text>
    </g>

    <!-- Row 8: Primary Action CTA -->
    <g transform="translate(16, 420)" filter="url(#btnElevation)">
      <rect width="295" height="46" rx="6" fill="#1E3A8A" />
      <g transform="translate(68, 15)">
        <text y="14" font-size="14" font-weight="700" fill="#FFFFFF">Complete Registration</text>
        <path d="M152 7 L157 11 L152 15" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>
  </g>

  <!-- 5. Secondary Switch Section -->
  <!-- Centered tightly below the form to fit the viewport -->
  <g transform="translate(187.5, 752)">
    <text font-size="12" fill="#475569" text-anchor="middle">
      <tspan font-weight="500">Already have an account? </tspan>
      <tspan font-weight="700" fill="#1E3A8A">Sign In here →</tspan>
    </text>
  </g>

  <!-- 6. iOS Home Indicator -->
  <rect x="122" y="796" width="131" height="4" rx="2" fill="#0F172A" opacity="0.8" />
</svg>
