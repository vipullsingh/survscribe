<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812" style="background-color: #F8FAFC; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Ultra-subtle, unboxed shadow for a premium feel -->
    <filter id="surfaceElevation" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.02" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.01" />
    </filter>
    <filter id="btnElevation" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1E3A8A" flood-opacity="0.08" />
    </filter>
    <filter id="tabElevation" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- ==================== ARTBOARD CANVAS ==================== -->
  <rect id="Background-Canvas" width="375" height="812" fill="#F8FAFC" />

  <!-- 1. iOS Native Status Bar -->
  <g id="Status-Bar" transform="translate(24, 16)">
    <text id="Time" x="4" y="14" font-size="13" font-weight="700" fill="#0F172A">09:41</text>
    <g id="System-Icons" transform="translate(270, 4)" fill="#0F172A">
      <rect x="0" y="6" width="2.5" height="4" rx="0.5" />
      <rect x="4" y="4" width="2.5" height="6" rx="0.5" />
      <rect x="8" y="2" width="2.5" height="8" rx="0.5" />
      <rect x="12" y="0" width="2.5" height="10" rx="0.5" />
      <rect x="22" y="0" width="20" height="10" rx="2.5" fill="none" stroke="#0F172A" stroke-width="1.2" />
      <rect x="24" y="2" width="13" height="6" rx="1" fill="#059669" />
      <path d="M43 3.5 C43.5 3.5 44 4 44 5 L44 5 C44 6 43.5 6.5 43 6.5" fill="#0F172A" />
    </g>
  </g>

  <!-- 2. Brand Header (Tightened Spacing, Subtle Reassurance) -->
  <g id="Header-Section" transform="translate(24, 60)">
    <!-- Row 1: Logo & Name -->
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#1E3A8A" />
    <path d="M18 7 C24 7 28 10.5 28 16.5 C28 24 21.5 29 18 32 C14.5 29 8 24 8 16.5 C8 10.5 12 7 18 7 Z" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <path d="M14 17.5 L17 20.5 L22 14" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="48" y="24" font-size="20" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Surv<tspan fill="#1E3A8A">Scribe</tspan></text>
    
    <!-- Row 2: Subtitle (Closer to brand) -->
    <text x="0" y="52" font-size="9" font-weight="700" fill="#64748B" letter-spacing="0.5">INSURANCE SURVEY &amp; LOSS ASSESSMENT</text>
    
    <!-- Row 3: Security Badge (Subtle, Text-only approach) -->
    <g transform="translate(0, 64)">
      <circle cx="3" cy="4" r="3" fill="#10B981" />
      <text x="12" y="8" font-size="10.5" font-weight="500" fill="#64748B">Secure workspace</text>
    </g>
  </g>

  <!-- 3. Page Introduction -->
  <g id="Page-Intro" transform="translate(24, 160)">
    <text x="0" y="16" font-size="22" font-weight="800" fill="#0F172A" letter-spacing="-0.4">Surveyor Sign In</text>
    <text x="0" y="40" font-size="13" font-weight="400" fill="#475569">
      Access your assigned claims, field evidence
    </text>
    <text x="0" y="58" font-size="13" font-weight="400" fill="#475569">
      and survey reports.
    </text>
  </g>

  <!-- 4. Authentication Card (Less "Boxy", Consistent Form Rhythm) -->
  <g id="Auth-Surface" transform="translate(24, 246)" filter="url(#surfaceElevation)">
    <!-- Subtler border stroke -->
    <rect x="0" y="0" width="327" height="352" rx="10" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5" />

    <!-- Segmented Auth Mode Switcher -->
    <g transform="translate(16, 16)">
      <rect x="0" y="0" width="295" height="36" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <g filter="url(#tabElevation)">
        <rect x="2" y="2" width="144" height="32" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
        <g transform="translate(28, 9)" stroke="#1E3A8A" stroke-width="1.4" fill="none">
          <rect x="0" y="4" width="11" height="9" rx="1.5" />
          <path d="M2.5 4 L2.5 2 C2.5 1 3.5 0 5.5 0 C7.5 0 8.5 1 8.5 2 L8.5 4" />
        </g>
        <text x="46" y="21" font-size="12" font-weight="700" fill="#1E3A8A">Password</text>
      </g>
      <g transform="translate(148, 0)">
        <g transform="translate(26, 10)" stroke="#64748B" stroke-width="1.3" fill="none">
          <rect x="0" y="0" width="10" height="15" rx="1.5" />
          <line x1="3" y1="12" x2="7" y2="12" stroke-linecap="round" />
        </g>
        <text x="42" y="22" font-size="12" font-weight="600" fill="#64748B">One-Time OTP</text>
      </g>
    </g>

    <!-- Field 1: Email or Username -->
    <g transform="translate(16, 76)">
      <text x="0" y="0" font-size="12" font-weight="600" fill="#334155">
        Email or Username <tspan fill="#DC2626">*</tspan>
      </text>
      <rect x="0" y="8" width="295" height="44" rx="6" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="1.5" />
      <g transform="translate(12, 22)" stroke="#1E3A8A" stroke-width="1.5" fill="none">
        <rect x="0" y="0" width="16" height="12" rx="2" />
        <path d="M0 1 L8 7 L16 1" />
      </g>
      <text x="38" y="35" font-size="13" font-weight="500" fill="#0F172A">surveyor.sharma@lossadjuster.in</text>
    </g>

    <!-- Field 2: Password (Proper gap from Email field) -->
    <g transform="translate(16, 144)">
      <text x="0" y="0" font-size="12" font-weight="600" fill="#334155">
        Password <tspan fill="#DC2626">*</tspan>
      </text>
      <rect x="0" y="8" width="295" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <g transform="translate(12, 22)" stroke="#64748B" stroke-width="1.5" fill="none">
        <rect x="0" y="5" width="14" height="10" rx="2" />
        <path d="M3 5 L3 2.5 C3 1.1 4.8 0 7 0 C9.2 0 11 1.1 11 2.5 L11 5" />
      </g>
      <g transform="translate(38, 32)" fill="#0F172A">
        <circle cx="0" cy="0" r="2.5" />
        <circle cx="8" cy="0" r="2.5" />
        <circle cx="16" cy="0" r="2.5" />
        <circle cx="24" cy="0" r="2.5" />
        <circle cx="32" cy="0" r="2.5" />
        <circle cx="40" cy="0" r="2.5" />
        <circle cx="48" cy="0" r="2.5" />
        <circle cx="56" cy="0" r="2.5" />
      </g>
      <g transform="translate(266, 23)" stroke="#64748B" stroke-width="1.5" fill="none">
        <path d="M0 6 C3 2 7 2 10 6 C7 10 3 10 0 6 Z" />
        <circle cx="5" cy="6" r="1.8" />
      </g>
    </g>

    <!-- Remember Device & Forgot Password -->
    <g transform="translate(16, 208)">
      <rect x="0" y="0" width="16" height="16" rx="4" fill="#1E3A8A" />
      <path d="M4 8 L7 11 L12 4.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="24" y="12.5" font-size="11.5" font-weight="500" fill="#475569">Remember device</text>
      <text x="295" y="12.5" font-size="11.5" font-weight="600" fill="#2563EB" text-anchor="end">Forgot password?</text>
    </g>

    <!-- Primary Action CTA -->
    <g transform="translate(16, 248)" filter="url(#btnElevation)">
      <rect x="0" y="0" width="295" height="46" rx="6" fill="#1E3A8A" />
      <g transform="translate(112, 15)">
        <text x="0" y="14" font-size="14" font-weight="700" fill="#FFFFFF">Sign In</text>
        <path d="M58 7 L63 11 L58 15" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- Security Subtext (Proper Left-aligned Vector Icon) -->
    <g transform="translate(56, 314)">
      <!-- Accurate SVG Lock Icon -->
      <g transform="translate(0, 0)" stroke="#94A3B8" stroke-width="1.5" fill="none">
        <rect x="1" y="5" width="10" height="8" rx="2" />
        <path d="M3 5 V3 C3 1.5 9 1.5 9 3 V5" />
        <circle cx="6" cy="9" r="1.5" fill="#94A3B8" stroke="none" />
      </g>
      <text x="18" y="12" font-size="10.5" font-weight="500" fill="#64748B">
        Encrypted session · Offline claim access
      </text>
    </g>
  </g>

  <!-- 5. Registration Section -->
  <g id="Registration-Section" transform="translate(187.5, 630)">
    <text font-size="13" fill="#475569" text-anchor="middle">
      <tspan x="0" y="0" font-weight="500">New to SurvScribe?</tspan>
      <tspan x="0" y="20" font-weight="700" fill="#1E3A8A">Register as a Surveyor →</tspan>
    </text>
  </g>

  <!-- 6. Footer Disclaimer (Slightly larger, darker text for readability) -->
  <g id="Footer-Disclaimer" transform="translate(187.5, 682)">
    <text font-size="11" font-weight="500" fill="#475569" text-anchor="middle">
      <tspan x="0" y="0">SurvScribe is a workflow platform designed to assist</tspan>
      <tspan x="0" y="16">licensed Insurance Surveyors and Loss Assessors. Final</tspan>
      <tspan x="0" y="32">claim liability determination remains with the insurer.</tspan>
    </text>
  </g>

  <!-- 7. iOS Home Indicator -->
  <rect x="122" y="796" width="131" height="4" rx="2" fill="#0F172A" opacity="0.8" />
</svg>
