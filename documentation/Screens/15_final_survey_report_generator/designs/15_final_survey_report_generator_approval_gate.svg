<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812" style="background-color:#F8FAFC;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <rect width="375" height="812" fill="#F8FAFC"/>
  <!-- Dimmed page behind -->
  <rect width="375" height="812" fill="#0F172A" opacity="0.06"/>
  <g transform="translate(24,18)" fill="#0F172A"><text x="0" y="12" font-size="13" font-weight="700">9:41</text>
    <g transform="translate(285,2)"><rect x="0" y="5" width="3" height="5" rx="1"/><rect x="5" y="3" width="3" height="7" rx="1"/><rect x="10" y="1" width="3" height="9" rx="1"/><rect x="19" y="1" width="18" height="9" rx="2.5" fill="none" stroke="#0F172A" stroke-width="1.1"/><rect x="21" y="3" width="12" height="5" rx="1"/></g></g>
  <rect width="375" height="812" fill="#0F172A" opacity="0.4"/>

  <!-- Bottom sheet -->
  <g transform="translate(0,318)">
    <rect width="375" height="494" rx="18" fill="#FFFFFF"/>
    <rect x="167" y="12" width="41" height="4" rx="2" fill="#CBD5E1"/>
    <text x="24" y="46" font-size="16" font-weight="800" fill="#0F172A">Human Approval Gate</text>
    <text x="24" y="66" font-size="10" fill="#64748B">All four must be confirmed and timestamped before any report</text>
    <text x="24" y="79" font-size="10" fill="#64748B">document generates. Final professional and legal responsibility</text>
    <text x="24" y="92" font-size="10" fill="#64748B">for the survey report remains with the licensed surveyor.</text>

    <!-- checkbox 1 checked -->
    <rect x="24" y="108" width="20" height="20" rx="5" fill="#1E3A8A"/>
    <path d="M29 118l4 4 8-9" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="116" font-size="10.5" fill="#0F172A">I have reviewed all AI-generated narrative content and text.</text>

    <!-- 2 -->
    <rect x="24" y="146" width="20" height="20" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="54" y="154" font-size="10.5" fill="#0F172A">I confirm the factual accuracy of site observations, timelines</text>
    <text x="54" y="168" font-size="10.5" fill="#0F172A">and damage items.</text>

    <!-- 3 -->
    <rect x="24" y="188" width="20" height="20" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="54" y="196" font-size="10.5" fill="#0F172A">I confirm the calculations, depreciation scales and policy-term</text>
    <text x="54" y="210" font-size="10.5" fill="#0F172A">interpretation.</text>

    <!-- 4 -->
    <rect x="24" y="230" width="20" height="20" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="54" y="238" font-size="10.5" fill="#0F172A">Final professional and legal responsibility for this report</text>
    <text x="54" y="252" font-size="10.5" fill="#0F172A">remains with me, the licensed surveyor.</text>

    <line x1="24" y1="280" x2="351" y2="280" stroke="#F1F5F9"/>
    <text x="24" y="302" font-size="9" fill="#64748B" font-family="'JetBrains Mono',monospace">1 of 4 confirmed · pending 3</text>

    <rect x="24" y="316" width="158" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="103" y="343" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Cancel</text>
    <rect x="193" y="316" width="158" height="44" rx="6" fill="#CBD5E1"/>
    <text x="272" y="343" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Confirm &amp; Export</text>
    <text x="24" y="386" font-size="8.5" fill="#94A3B8">Confirm &amp; Export unlocks only when all four boxes are checked. The</text>
    <text x="24" y="398" font-size="8.5" fill="#94A3B8">acceptance is written to the immutable audit log with a timestamp.</text>
  </g>
</svg>
