  <g transform="translate(20,348)"><rect width="335" height="176" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="14" y="14" width="20" height="20" rx="5" fill="#EFF6FF"/><text x="24" y="28" text-anchor="middle" font-size="11" font-weight="800" fill="#1E3A8A">1</text>
    <text x="44" y="28" font-size="12.5" font-weight="700" fill="#0F172A">Insurer Particulars</text>
    <text x="315" y="28" font-size="14" font-weight="700" fill="#64748B">–</text>
    <line x1="14" y1="46" x2="321" y2="46" stroke="#F1F5F9"/>
    <text x="14" y="66" font-size="10" font-weight="700" fill="#334155">Appointing Insurer</text>
    <rect x="14" y="72" width="307" height="34" rx="6" fill="#F6FEF9" stroke="#BBF7D0"/>
