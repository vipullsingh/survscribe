    <rect x="20" y="45" width="335" height="5" rx="2.5" fill="#F1F5F9"/><rect x="20" y="45" width="22" height="5" rx="2.5" fill="#1E3A8A"/></g>

  <!-- Scan card -->
  <g transform="translate(20,160)" filter="url(#elev)"><rect width="335" height="120" rx="10" fill="#F8FAFF" stroke="#93C5FD" stroke-dasharray="4 3"/></g>
  <g transform="translate(20,160)">
    <rect x="147" y="16" width="40" height="40" rx="10" fill="#EFF6FF"/>
    <g transform="translate(157,26)" stroke="#1E3A8A" stroke-width="1.7" fill="none"><rect x="0" y="4" width="20" height="15" rx="2"/><path d="M5 4l1.6-3h6.8L15 4"/><circle cx="10" cy="11.5" r="3.4"/></g>
    <text x="167" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Scan Appointment Letter</text>
    <text x="167" y="93" text-anchor="middle" font-size="10" fill="#64748B">Photograph the insurer letter or pick a PDF — AI-2 parses it</text>
    <rect x="107" y="102" width="120" height="30" rx="6" fill="#1E3A8A"/>
    <text x="167" y="121" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Run AI extraction</text>
  </g>

  <!-- Duplicate warning -->
  <g transform="translate(20,292)"><rect width="335" height="44" rx="8" fill="#FFFBEB" stroke="#FDE68A"/>
    <path d="M14 14l8 14H6Z" fill="none" stroke="#D97706" stroke-width="1.6" stroke-linejoin="round" transform="translate(0,4)"/>
    <text x="34" y="19" font-size="10" font-weight="700" fill="#92400E">Possible duplicate — Policy FIP/0042158/2026 + this loss date</text>
    <text x="34" y="33" font-size="10" fill="#92400E">already exists as SS-2026-00074. Confirm before creating.</text></g>

