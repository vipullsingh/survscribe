    <rect x="282" y="82" width="32" height="14" rx="3" fill="#F0FDF4" stroke="#BBF7D0"/><text x="298" y="92" text-anchor="middle" font-size="8" font-weight="800" fill="#065F46">98%</text>
    <text x="14" y="126" font-size="10" font-weight="700" fill="#334155">Insurer Claim Ref No</text>
    <rect x="14" y="132" width="307" height="34" rx="6" fill="#F6FEF9" stroke="#BBF7D0"/>
    <text x="24" y="153" font-size="11.5" fill="#0F172A" font-family="'JetBrains Mono',monospace">27120031250400001234</text>
    <rect x="282" y="142" width="32" height="14" rx="3" fill="#F0FDF4" stroke="#BBF7D0"/><text x="298" y="152" text-anchor="middle" font-size="8" font-weight="800" fill="#065F46">96%</text>
  </g>

  <!-- Collapsed accordion rows -->
  <g transform="translate(20,532)" font-size="12.5" font-weight="700" fill="#0F172A">
    <rect width="335" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><text x="44" y="25">Policy &amp; Insured Basics</text><text x="315" y="25" font-size="14" fill="#64748B">+</text>
    <rect x="14" y="10" width="20" height="20" rx="5" fill="#F1F5F9"/><text x="24" y="24" text-anchor="middle" font-size="11" font-weight="800" fill="#64748B">2</text>
    <g transform="translate(0,48)"><rect width="335" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><text x="44" y="25">Loss Particulars</text><text x="315" y="25" font-size="14" fill="#64748B">+</text>
      <rect x="14" y="10" width="20" height="20" rx="5" fill="#F1F5F9"/><text x="24" y="24" text-anchor="middle" font-size="11" font-weight="800" fill="#64748B">3</text></g>
  </g>

  <!-- Urgency tags -->
  <g transform="translate(20,676)"><text x="0" y="8" font-size="10" font-weight="700" fill="#334155">Urgency</text>
    <rect x="0" y="16" width="104" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="52" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Normal</text>
    <rect x="114" y="16" width="104" height="28" rx="6" fill="#1E3A8A"/><text x="166" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Urgent</text>
    <rect x="228" y="16" width="107" height="28" rx="6" fill="#FFFFFF" stroke="#FECACA"/><text x="281" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">CAT Event</text></g>

  <!-- Sticky CTA -->
  <g transform="translate(0,748)"><rect width="375" height="64" fill="#FFFFFF"/><line x1="0" y1="0" x2="375" y2="0" stroke="#E2E8F0"/>
    <rect x="20" y="12" width="335" height="42" rx="6" fill="#1E3A8A"/>
    <text x="187" y="38" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Save &amp; Next: Policy Review  →</text></g>
</svg>
