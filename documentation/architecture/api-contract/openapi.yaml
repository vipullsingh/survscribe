- name: Auth
  description: Stage 0 registration, login, tokens and sessions.
- name: Store
  description: 'The surveyor firm: invites and membership.'
- name: Claims
  description: Claim files and the 15-stage state machine.
- name: Stage 02
  description: Policy schedule and coverage review
- name: Stage 03
  description: Insured contact attempt log
- name: Stage 04
  description: Site visits, initial and follow-up
- name: Stage 05
  description: Cause and circumstances of loss
- name: Stage 06
  description: Damaged property itemised register
- name: Stage 07
  description: Document locker
- name: Stage 10
  description: OCR line items and forensic audit
- name: Stage 08
  description: Document requisition notices
- name: Stage 11
  description: Head-wise assessment and underinsurance
- name: Stage 12
  description: Salvage inventory and disposal
- name: Stage 13
  description: Coverage and liability opinion
- name: Stage 14
  description: Final Survey Report
- name: Stage 15
  description: Seven-gate pre-submission audit
- name: Cross-stage
  description: Discrepancy flags raised by rules and AI across stages.
- name: Audit
  description: The immutable audit trail (SRS 5.1 rule 3, 6.2).
- name: Media
  description: Chunked upload of watermarked evidence.
- name: Sync
  description: Offline-first bi-directional sync. Provisional -- sprint_0002 owns this contract.
