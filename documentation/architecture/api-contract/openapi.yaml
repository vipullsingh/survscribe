# SurvScribe API contract v1 -- GENERATED FILE, DO NOT EDIT BY HAND.
#
# Regenerate with:  python apps/backend/scripts/gen_openapi.py
# Entity schemas are derived from apps/backend/migrations/*.up.sql, which is
# itself extracted from documentation/architecture/physical-schema.md.
# Editing this file directly will be overwritten and will let the contract
# drift from the database.
#
# Frozen at v1.0.0 under sprint_0001 task 3. See info.description for the
# change-control rule.

openapi: 3.0.3
info:
  title: SurvScribe API
  version: 1.0.0
  description: |-
    REST/JSON contract for the SurvScribe platform: Stage 0 authentication and the 15-stage general claim survey workflow.

    **Change control.** This contract is frozen at v1.0.0 under `sprint_0001` task 3. It is not immutable, but it is not edited casually either: an additive change (a new optional field, a new endpoint) is a minor version bump; anything that could break a shipped mobile client -- a removed or renamed field, a narrowed type, a new required request property, a removed enum value -- requires an ADR and a major bump, because a field surveyor may be running an old build offline for up to 30 days (CR-A12) and cannot be forced to update.

    **Generated, not hand-written.** Every entity schema here is derived from the DDL in `apps/backend/migrations/`, which is itself extracted from `documentation/architecture/physical-schema.md`. Contract and database therefore cannot drift apart. Regenerate rather than edit entity schemas by hand.

    **Conventions (ADR-0004).** Base path `/api/v1`; plural kebab-case resources; every response uses the success or error envelope; list responses carry `meta` pagination.

    **Store isolation.** `store_id` is always taken from the verified JWT and is never accepted in a request body, query string or path (ADR-0004 section 4, `identity-and-rbac.md` section 3.2). It is absent from every `*Create` and `*Update` schema for that reason, and a body containing it is rejected -- the write schemas set `additionalProperties: false`.

    **Money is a string.** Every `NUMERIC` value crosses the wire as a decimal string, not a JSON number. IEEE-754 doubles cannot represent `NUMERIC(15,2)` exactly, and FR-15.1 gate 1 requires the Section F totals to reconcile to the rupee.

    **Regulatory.** The platform assists licensed surveyors; it is not an insurer, an intermediary, an IRDAI-approved entity, or an autonomous claims decision-maker. No endpoint approves or repudiates a claim, and no endpoint lets AI set or alter a monetary value.
  contact:
    name: SurvScribe
    email: vipul@tezminds.com
  license:
    name: Proprietary
servers:
- url: http://localhost:8080/api/v1
  description: Local development
- url: https://{host}/api/v1
  description: Deployed environment. No environment has been provisioned yet -- the host is supplied by
    configuration (ADR-0008), not hard-coded here.
  variables:
    host:
      default: localhost:8080
      description: API host for the target environment.
