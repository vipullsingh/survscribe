        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /claims/{claimId}/pre-submission-audits/run:
    parameters:
    - $ref: '#/components/parameters/ClaimId'
    post:
      tags:
      - Stage 15
      summary: Run the seven compliance gates
      description: FR-15.1. Always returns 200 with the run; a failing gate is a result, not an HTTP error.
        Submission stays blocked until every gate passes.
      operationId: runPreSubmissionAudit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                final_survey_report_id:
                  type: string
                  format: uuid
              required:
              - final_survey_report_id
      responses:
        '200':
          description: Audit run recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/PreSubmissionAudit'
                  error:
                    type: object
                    nullable: true
                    example: null
                  meta:
                    type: object
                    nullable: true
                    example: null
                required:
                - success
                - data
                - error
                - meta
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /claims/{claimId}/final-reports/{id}/sign-off:
    parameters:
    - $ref: '#/components/parameters/ClaimId'
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Stage 15
      summary: Sign off the FSR and take the SHA-256 snapshot
      description: Requires a passing audit run, the four approval points, and a licence number and category
        on the signing surveyor (D35). Writes an audit_log SIGN_OFF row.
      operationId: signOffFinalReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignOffRequest'
      responses:
        '200':
          description: Signed off.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/FinalSurveyReport'
                  error:
                    type: object
                    nullable: true
                    example: null
                  meta:
                    type: object
                    nullable: true
                    example: null
                required:
                - success
                - data
                - error
                - meta
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /media/uploads:
    post:
      tags:
      - Media
      summary: Start a chunked media upload
      description: Section 6.1 chunked pipeline. The photo is already compressed to 1600x1200 at 85% and
        watermarked on the device before this call.
      operationId: initMediaUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUploadInit'
      responses:
        '201':
          description: Upload ticket.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/MediaUploadTicket'
                  error:
                    type: object
                    nullable: true
                    example: null
                  meta:
                    type: object
                    nullable: true
                    example: null
                required:
                - success
                - data
                - error
                - meta
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
