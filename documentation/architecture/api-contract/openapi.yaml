        email:
          type: string
          format: email
        mobile:
          type: string
          maxLength: 16
          nullable: true
        role_id:
          type: string
          format: uuid
          description: References roles.id.
        invited_by_user_id:
          type: string
          format: uuid
          description: References users.id.
        token_hash:
          type: string
          maxLength: 64
          minLength: 64
        status:
          $ref: '#/components/schemas/InviteStatus'
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
          nullable: true
        accepted_user_id:
          type: string
          format: uuid
          description: References users.id.
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        revoked_by_user_id:
          type: string
          format: uuid
          description: References users.id.
          nullable: true
        created_ip:
          type: string
          description: IP address.
          nullable: true
        created_user_agent:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
