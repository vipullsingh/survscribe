        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sync/push:
    post:
      tags:
      - Sync
      summary: Push local changes
      description: PROVISIONAL -- sprint_0002 owns this contract. Conflicts come back per field, never
        per row, and are never resolved silently (AC 16.1.3).
      operationId: syncPush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: Applied, with any conflicts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/SyncPushResult'
                  error:
                    type: object
                    nullable: true
                    example: null
                  meta:
                    type: object
                    nullable: true
                    example: null
                required:
                - success
                - data
                - error
                - meta
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /sync/pull:
    get:
      tags:
      - Sync
      summary: Pull server changes since a revision
      description: PROVISIONAL -- sprint_0002 owns this contract.
      operationId: syncPull
      parameters:
      - name: device_id
        in: query
        required: true
        schema:
          type: string
          maxLength: 128
      - name: since_revision
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 200
      responses:
        '200':
          description: Changes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/SyncPullResult'
                  error:
                    type: object
                    nullable: true
                    example: null
                  meta:
                    type: object
                    nullable: true
                    example: null
                required:
                - success
                - data
                - error
                - meta
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'RS256 access token, 15-minute lifetime (ADR-0003). Claims: `sub`, `store_id`, `client_id`,
        `sid`, `roles[]`, `perms[]`, `pv`. A privilege change bumps `pv` on the user, so a stale token
        dies within one lifetime.'
  parameters:
    ClaimId:
      name: claimId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Claim UUID. Client-generated when created offline.
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
  responses:
    Unauthenticated:
      description: Missing, expired or invalid access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 'Authenticated but not permitted: a missing permission, a cross-store access attempt
        (STORE_SCOPE_VIOLATION), or an insurer viewer with no live claim grant (CLAIM_GRANT_REQUIRED).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: No such resource within the caller's store.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 'State conflict: duplicate, stale revision, or a precondition such as an unsatisfied
        approval gate.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: Field-level validation failure; see `error.details`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AuditAction:
      type: string
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - VIEW
      - DOWNLOAD
      - EXPORT
      - APPROVE
      - SUBMIT
      - SIGN_OFF
      - RESTORE
      description: PostgreSQL enum `audit_action`.
    AuditGateResult:
      type: string
      enum:
      - PASS
      - FAIL
      - NOT_RUN
      description: PostgreSQL enum `audit_gate_result`.
    AuditStatus:
      type: string
      enum:
      - VERIFIED
      - RATE_INFLATED
      - DUPLICATE
      - NOT_DAMAGED_IN_INCIDENT
      - OBSOLETE_ITEM
      - BETTERMENT
      - PARTIALLY_ALLOWED
      - DISALLOWED
      - PENDING_REVIEW
      description: PostgreSQL enum `audit_status`.
    ChronologyEventType:
      type: string
      enum:
      - PRE_INCIDENT_ACTIVITY
      - LOSS_OCCURRENCE
      - LOSS_DISCOVERY
      - EMERGENCY_RESPONSE
      - EXTINGUISHMENT_CONTAINMENT
      - POST_LOSS_ACTION
      description: PostgreSQL enum `chronology_event_type`.
    ClaimStatus:
      type: string
      enum:
      - DRAFT_OFFLINE
      - ACTIVE
      - ON_HOLD
      - COMPLETED_SUBMITTED
      - CANCELLED
      description: PostgreSQL enum `claim_status`.
    ContactOutcome:
      type: string
      enum:
      - CONNECTED
      - NO_ANSWER
      - BUSY
      - UNREACHABLE
      - WRONG_NUMBER
      - SITE_VISIT_CONFIRMED
      - RESCHEDULE_REQUESTED
      - REFUSED
      description: PostgreSQL enum `contact_outcome`.
    DamageRecommendation:
      type: string
      enum:
      - REPAIRABLE
      - REPLACE
      - SALVAGE
      description: PostgreSQL enum `damage_recommendation`.
    DamageSeverity:
      type: string
      enum:
      - TOTAL_LOSS
      - SEVERE
      - MODERATE
      - MINOR
      description: PostgreSQL enum `damage_severity`.
    DetectedBy:
      type: string
      enum:
      - SYSTEM_RULE
      - AI_ASSISTANT
      - SURVEYOR
      description: PostgreSQL enum `detected_by`.
    DevicePlatform:
      type: string
      enum:
      - IOS
      - ANDROID
      - WEB
      description: PostgreSQL enum `device_platform`.
    DiscrepancyCode:
      type: string
      enum:
      - LOCATION_DISCREPANCY_DETECTED
      - CHRONOLOGY_GAP_DETECTED
      - DUPLICATE_CLAIM_ITEM
      - RATE_INFLATION_DETECTED
      - ITEM_NOT_IN_DAMAGE_REGISTER
      - OBSOLETE_ITEM_CLAIMED
      - BETTERMENT_DETECTED
      - UNDERINSURANCE_DETECTED
      - REPAIRABLE_VS_TOTAL_LOSS_CONTRADICTION
      - METADATA_MISMATCH
      - ARITHMETIC_MISMATCH
      - MISSING_DEDUCTION_REMARK
      - PHOTO_ANNEXURE_INCOMPLETE
      - MANDATORY_DOCUMENT_MISSING
      - NARRATIVE_CONTRADICTION
      description: PostgreSQL enum `discrepancy_code`.
    DiscrepancySeverity:
      type: string
      enum:
      - INFO
      - WARNING
      - CRITICAL
      description: PostgreSQL enum `discrepancy_severity`.
    DiscrepancyStatus:
      type: string
      enum:
      - OPEN
      - RESOLVED
      - ACCEPTED
      - DISMISSED
      description: PostgreSQL enum `discrepancy_status`.
    DispatchChannel:
      type: string
      enum:
      - WHATSAPP
      - EMAIL
      - SMS
      - PHONE
      - IN_PERSON
      - COURIER
      - INSURER_PORTAL
