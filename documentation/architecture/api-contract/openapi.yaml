    AuditLog:
      type: object
      description: Read model for `audit_log`.
      properties:
        id:
          type: integer
          format: int64
          nullable: true
        store_id:
          type: string
          format: uuid
          description: References stores.id.
        claim_id:
          type: string
          format: uuid
          description: References claims.id.
          nullable: true
        actor_user_id:
          type: string
          format: uuid
          description: References users.id.
          nullable: true
        actor_role_scope:
          $ref: '#/components/schemas/RoleScopeOrNull'
        session_id:
          type: string
          format: uuid
          description: References sessions.id.
          nullable: true
        entity:
          type: string
          maxLength: 64
        entity_id:
          type: string
          format: uuid
        field:
          type: string
          maxLength: 64
          nullable: true
        old_value:
          type: string
          nullable: true
        new_value:
          type: string
          nullable: true
        action:
          $ref: '#/components/schemas/AuditAction'
        stage:
          type: integer
          format: int32
          nullable: true
        reason:
          type: string
          nullable: true
        ip_address:
          type: string
          description: IP address.
          nullable: true
        user_agent:
          type: string
          nullable: true
        device_id:
          type: string
          maxLength: 128
          nullable: true
        request_id:
          type: string
          maxLength: 64
          nullable: true
        is_offline_origin:
          type: boolean
        client_occurred_at:
          type: string
          format: date-time
          nullable: true
        occurred_at:
          type: string
          format: date-time
      required:
      - store_id
      - entity
      - entity_id
      - action
    RegisterRequest:
      type: object
      additionalProperties: false
      description: Registration always creates a NEW store (ADR-0005 D40). Joining an existing store is
        invite-only via POST /auth/invites/accept.
      properties:
        full_name:
          type: string
          minLength: 3
          maxLength: 150
        firm_name:
          type: string
          minLength: 2
          maxLength: 200
        email:
          type: string
          format: email
        mobile:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
          example: '+919876543210'
        password:
          type: string
          minLength: 8
          format: password
          description: Min 8 chars, >=1 uppercase, >=1 number, >=1 special (00_auth_signup.md section
            4).
        sla_license_no:
          type: string
          nullable: true
          description: Optional at signup (D35); required before FSR sign-off.
        sla_category:
          $ref: '#/components/schemas/SlaCategoryOrNull'
        base_location:
          type: string
          nullable: true
          maxLength: 120
        terms_accepted:
          type: boolean
          enum:
          - true
        terms_version:
          type: string
          maxLength: 16
        device:
          $ref: '#/components/schemas/DeviceInfo'
      required:
      - full_name
      - firm_name
      - email
      - mobile
      - password
      - terms_accepted
      - terms_version
      - device
    DeviceInfo:
      type: object
      additionalProperties: false
      properties:
        device_id:
          type: string
          maxLength: 128
        device_name:
          type: string
          nullable: true
          maxLength: 120
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        model:
          type: string
          nullable: true
        os_version:
          type: string
          nullable: true
        app_version:
          type: string
          nullable: true
      required:
      - device_id
      - platform
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        identifier:
          type: string
          description: 'Universal identifier: email, 10-digit +91 mobile, or username (CR-A1). Resolved
            globally; identifiers are unique across all stores (ADR-0005 D43).'
        password:
          type: string
          format: password
        remember_me:
          type: boolean
          default: true
        device:
          $ref: '#/components/schemas/DeviceInfo'
      required:
      - identifier
      - password
      - device
    TokenPair:
      type: object
      description: ADR-0003 dual token. The access token is RS256 and lives 15 minutes; the refresh token
        is a 64-byte opaque value, rotated on every use, and must be stored in the iOS Keychain / Android
        Keystore.
      properties:
        access_token:
          type: string
        access_token_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_token_expires_at:
          type: string
          format: date-time
        session_id:
          type: string
          format: uuid
        offline_grace_until:
          type: string
          format: date-time
          description: 30-day offline grace (CR-A12).
      required:
      - access_token
      - access_token_expires_at
      - refresh_token
      - refresh_token_expires_at
      - session_id
    AuthSession:
      type: object
      properties:
        tokens:
          $ref: '#/components/schemas/TokenPair'
        user:
          $ref: '#/components/schemas/User'
        store:
          $ref: '#/components/schemas/Store'
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
      required:
      - tokens
      - user
      - store
      - roles
      - permissions
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
        device_id:
          type: string
          maxLength: 128
      required:
      - refresh_token
      - device_id
    OtpRequest:
      type: object
      additionalProperties: false
      properties:
        identifier:
          type: string
        channel:
          $ref: '#/components/schemas/OtpChannel'
        purpose:
          $ref: '#/components/schemas/OtpPurpose'
      required:
      - identifier
      - channel
      - purpose
    OtpChallengeAccepted:
      type: object
      description: Deliberately reveals nothing about whether the identifier exists.
      properties:
        challenge_id:
          type: string
          format: uuid
        resend_available_at:
          type: string
          format: date-time
          description: SMS 30 s, email 45 s (D33).
        expires_at:
          type: string
          format: date-time
      required:
      - challenge_id
      - resend_available_at
      - expires_at
    OtpVerifyRequest:
      type: object
      additionalProperties: false
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^[0-9]{6}$
        device:
          $ref: '#/components/schemas/DeviceInfo'
      required:
      - challenge_id
      - code
      - device
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      properties:
        identifier:
          type: string
      required:
      - identifier
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 8
          format: password
      required:
      - token
      - new_password
    AcceptInviteRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
        full_name:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 8
          format: password
        terms_accepted:
          type: boolean
          enum:
          - true
        terms_version:
          type: string
        device:
          $ref: '#/components/schemas/DeviceInfo'
      required:
      - token
      - full_name
      - password
      - terms_accepted
      - terms_version
      - device
    StageAdvanceRequest:
      type: object
      additionalProperties: false
      properties:
        to_stage:
          type: integer
          minimum: 1
          maximum: 15
        note:
          type: string
          nullable: true
      required:
      - to_stage
    ApprovalGateRequest:
      type: object
      additionalProperties: false
      description: FR-14.4. All four points must be true in one request; the server timestamps each and
        writes an audit_log APPROVE row. Export stays blocked until every point is recorded (CLAUDE.md
        14.4).
      properties:
        reviewed_ai_content:
          type: boolean
          enum:
          - true
        confirmed_factual_accuracy:
          type: boolean
          enum:
          - true
        confirmed_calculations:
          type: boolean
          enum:
          - true
        accepted_professional_responsibility:
          type: boolean
          enum:
          - true
      required:
      - reviewed_ai_content
      - confirmed_factual_accuracy
      - confirmed_calculations
      - accepted_professional_responsibility
    ExportRequest:
      type: object
      additionalProperties: false
      properties:
        engine:
          type: string
          enum:
          - server
          default: server
          description: Only the server engine is authoritative (D22). A client-generated offline draft
            is uploaded through the media endpoints instead.
    SignOffRequest:
      type: object
      additionalProperties: false
      properties:
        surveyor_signature_media_id:
          type: string
          format: uuid
        declaration_accepted:
          type: boolean
          enum:
          - true
      required:
      - surveyor_signature_media_id
      - declaration_accepted
    MediaUploadInit:
      type: object
      additionalProperties: false
      properties:
        media_attachment_id:
          type: string
          format: uuid
        byte_size:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        mime_type:
          type: string
        chunk_size_bytes:
          type: integer
          default: 5242880
      required:
      - media_attachment_id
      - byte_size
      - sha256
      - mime_type
    MediaUploadTicket:
      type: object
      properties:
        upload_id:
          type: string
        chunk_size_bytes:
          type: integer
        chunk_count:
          type: integer
        expires_at:
          type: string
          format: date-time
      required:
      - upload_id
      - chunk_size_bytes
      - chunk_count
      - expires_at
    SyncPushRequest:
      type: object
      additionalProperties: false
      description: PROVISIONAL. sprint_0002 is the sync spike and owns this shape.
      properties:
        device_id:
          type: string
          maxLength: 128
        since_revision:
          type: integer
          format: int64
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'
      required:
      - device_id
      - changes
    SyncChange:
      type: object
      additionalProperties: false
      properties:
        entity:
          type: string
          example: assessment_line_items
        entity_id:
          type: string
          format: uuid
          description: Client-generated UUIDv4, adopted verbatim by the server.
        claim_id:
          type: string
          format: uuid
          nullable: true
        operation:
          $ref: '#/components/schemas/SyncOperation'
        payload:
          type: object
          additionalProperties: true
        field_updated_at:
          type: object
          additionalProperties:
            type: string
            format: date-time
          description: Per-field device timestamps. This is what makes AC 16.1.3 a field-level merge rather
            than last-write-wins.
        base_sync_revision:
          type: integer
          format: int64
          nullable: true
        client_updated_at:
          type: string
          format: date-time
      required:
      - entity
      - entity_id
      - operation
      - payload
      - field_updated_at
      - client_updated_at
    SyncPushResult:
      type: object
      properties:
        accepted:
          type: array
          items:
            $ref: '#/components/schemas/SyncAccepted'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/SyncConflict'
        server_revision:
          type: integer
          format: int64
      required:
      - accepted
      - conflicts
      - server_revision
    SyncAccepted:
      type: object
      properties:
        entity:
          type: string
        entity_id:
          type: string
          format: uuid
        sync_revision:
          type: integer
          format: int64
        server_assigned:
          type: object
          additionalProperties: true
          description: Server-allocated values the device could not know, e.g. claims.claim_ref_no (FR-1.3).
      required:
      - entity
      - entity_id
      - sync_revision
    SyncConflict:
      type: object
      description: Returned per field, never per row. The surveyor confirms the resolution (AC 16.1.3);
        the server never picks a winner silently.
      properties:
        entity:
          type: string
        entity_id:
          type: string
          format: uuid
        fields:
          type: object
          additionalProperties:
            type: object
            properties:
              local: {}
              server: {}
              local_at:
                type: string
                format: date-time
              server_at:
                type: string
                format: date-time
      required:
      - entity
      - entity_id
      - fields
    SyncPullResult:
      type: object
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'
        server_revision:
          type: integer
          format: int64
        has_more:
          type: boolean
      required:
      - changes
      - server_revision
      - has_more
