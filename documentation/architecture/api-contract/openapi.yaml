    FirmType:
      type: string
      enum:
      - SOLE_PROPRIETORSHIP
      - PARTNERSHIP
      - LLP
      - PRIVATE_LIMITED
      - OTHER
      description: PostgreSQL enum `firm_type`.
    HeadCategory:
      type: string
      enum:
      - BUILDING_CIVIL
      - PLANT_MACHINERY
      - FURNITURE_FIXTURES_FITTINGS
      - STOCKS
      - OTHER_INSURED_PROPERTY
      description: PostgreSQL enum `head_category`.
    InviteStatus:
      type: string
      enum:
      - PENDING
      - ACCEPTED
      - EXPIRED
      - REVOKED
      description: PostgreSQL enum `invite_status`.
    MediaType:
      type: string
      enum:
      - PHOTO
      - VIDEO
      - AUDIO
      description: PostgreSQL enum `media_type`.
    OcrStatus:
      type: string
      enum:
      - NOT_APPLICABLE
      - PENDING
      - PROCESSING
      - COMPLETED
      - FAILED
      description: PostgreSQL enum `ocr_status`.
    OtpChannel:
      type: string
      enum:
      - SMS
      - EMAIL
      description: PostgreSQL enum `otp_channel`.
    OtpPurpose:
      type: string
      enum:
      - LOGIN
      - SIGNUP_VERIFY
      - PASSWORD_RESET
      description: PostgreSQL enum `otp_purpose`.
    PerilAdmissibility:
      type: string
      enum:
      - Admissible
      - Inadmissible
      - Disputed
      description: PostgreSQL enum `peril_admissibility`.
    PerilType:
      type: string
      enum:
      - FIRE
      - LIGHTNING
      - EXPLOSION_IMPLOSION
      - FLOOD_INUNDATION
      - STORM_CYCLONE
      - EARTHQUAKE
      - BURGLARY_THEFT
      - RIOT_STRIKE_MALICIOUS_DAMAGE
      - IMPACT_DAMAGE
      - MACHINERY_BREAKDOWN
      - ELECTRONIC_EQUIPMENT_FAILURE
      - BURST_PIPE
      - SPONTANEOUS_COMBUSTION
      - SHORT_CIRCUIT
      - MARINE_TRANSIT
      - OTHER
      description: PostgreSQL enum `peril_type`.
    PolicySectionHead:
      type: string
      enum:
      - BUILDING
      - PLANT_MACHINERY
      - FURNITURE_FIXTURES
      - RAW_MATERIALS
      - WORK_IN_PROGRESS
      - FINISHED_GOODS
      - STOCK_IN_OPEN
      - OTHER
      description: PostgreSQL enum `policy_section_head`.
    PolicyType:
      type: string
      enum:
      - STANDARD_FIRE_SPECIAL_PERILS
      - INDUSTRIAL_ALL_RISKS
      - BURGLARY
      - MACHINERY_BREAKDOWN
      - ELECTRONIC_EQUIPMENT
      - MARINE_CARGO
      - OTHER
      description: PostgreSQL enum `policy_type`.
    ReportStatus:
      type: string
      enum:
      - DRAFT
      - AI_DRAFTED
      - UNDER_REVIEW
      - APPROVED
      - GENERATED
      - SUBMITTED
      - SUPERSEDED
      description: PostgreSQL enum `report_status`.
    RoleScope:
      type: string
      enum:
      - SURVEYOR
      - REVIEWER
      - ADMIN
      - INSURER_VIEWER
      description: PostgreSQL enum `role_scope`.
    SessionStatus:
      type: string
      enum:
      - ACTIVE
      - LOGGED_OUT
      - EXPIRED
      - REVOKED
      - SUPERSEDED
      description: PostgreSQL enum `session_status`.
    SignupSource:
      type: string
      enum:
      - SELF_SIGNUP
      - INVITE
      description: PostgreSQL enum `signup_source`.
    StoreStatus:
      type: string
      enum:
      - ACTIVE
      - SUSPENDED
      description: PostgreSQL enum `store_status`.
    SurveyorRecommendation:
      type: string
      enum:
      - Admissible as Assessed
      - Subject to Insurer Liability Determination
      - Non-Admissible
      - Repudiation Recommended
      description: PostgreSQL enum `surveyor_recommendation`.
    SyncOperation:
      type: string
      enum:
      - CREATE
      - UPDATE
      - DELETE
      description: PostgreSQL enum `sync_operation`.
    SyncStatus:
      type: string
      enum:
      - PENDING
      - IN_FLIGHT
      - SYNCED
      - CONFLICT
      - FAILED
      - ABANDONED
      description: PostgreSQL enum `sync_status`.
    Uom:
      type: string
      enum:
      - NOS
      - KGS
      - MT
      - LTRS
      - METERS
      - SQFT
      - SQM
      - SETS
      - PAIRS
      - ROLLS
      - BAGS
      - LOT
      description: PostgreSQL enum `uom`.
    UserStatus:
      type: string
      enum:
      - PENDING_VERIFICATION
      - ACTIVE
      - SUSPENDED
      - DEACTIVATED
      description: PostgreSQL enum `user_status`.
    VisitType:
      type: string
      enum:
      - INITIAL
      - FOLLOW_UP
      description: PostgreSQL enum `visit_type`.
    WarrantyComplianceStatus:
      type: string
      enum:
      - All Complied
      - Material Breach
      description: PostgreSQL enum `warranty_compliance_status`.
    Meta:
      type: object
      description: Pagination metadata (ADR-0004 section 2).
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        limit:
          type: integer
          minimum: 1
          maximum: 200
          example: 20
        total:
          type: integer
          minimum: 0
          example: 142
      required:
      - page
      - limit
      - total
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          example: license_number
        issue:
          type: string
          example: Must match regex SLA-[0-9]{4,8}
      required:
      - field
      - issue
    ApiError:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
          nullable: true
      required:
      - code
      - message
    ErrorCode:
      type: string
      description: Stable machine-readable error code. Clients branch on this, never on `message`.
      enum:
      - VALIDATION_FAILED
      - UNAUTHENTICATED
      - TOKEN_EXPIRED
      - TOKEN_REUSE_DETECTED
      - PERMISSION_DENIED
      - STORE_SCOPE_VIOLATION
      - CLAIM_GRANT_REQUIRED
      - NOT_FOUND
      - CONFLICT
      - SYNC_CONFLICT
      - STAGE_PRECONDITION_FAILED
      - APPROVAL_GATE_NOT_SATISFIED
      - AUDIT_GATE_FAILED
      - DEDUCTION_REMARK_REQUIRED
      - GPS_ACCURACY_REJECTED
      - ACCOUNT_LOCKED
      - OTP_INVALID
      - OTP_EXPIRED
      - RATE_LIMITED
      - OFFLINE_GRACE_EXPIRED
      - PAYLOAD_TOO_LARGE
      - INTERNAL_ERROR
    ErrorResponse:
      type: object
      description: ADR-0004 section 3 error envelope.
      properties:
        success:
          type: boolean
          enum:
          - false
        data:
          type: object
          nullable: true
          example: null
        error:
          $ref: '#/components/schemas/ApiError'
        meta:
          type: object
          nullable: true
          example: null
      required:
      - success
      - data
      - error
      - meta
    PolicyDetail:
      type: object
      description: Read model for `policy_details`.
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        claim_id:
          type: string
          format: uuid
          description: References claims.id.
        store_id:
          type: string
          format: uuid
          description: References stores.id.
        client_id:
          type: string
          format: uuid
          description: References users.id.
        assigned_surveyor_id:
          type: string
          format: uuid
          description: References users.id.
          nullable: true
        reviewer_id:
          type: string
          format: uuid
          description: References users.id.
          nullable: true
        access_role_scope:
          $ref: '#/components/schemas/RoleScope'
        policy_type:
          $ref: '#/components/schemas/PolicyType'
        inception_date:
          type: string
          format: date
        expiry_date:
          type: string
          format: date
