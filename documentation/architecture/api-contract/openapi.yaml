        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /media/uploads/{uploadId}/chunks/{index}:
    put:
      tags:
      - Media
      summary: Upload one chunk
      operationId: uploadMediaChunk
      parameters:
      - name: uploadId
        in: path
        required: true
        schema:
          type: string
      - name: index
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Chunk stored.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /media/uploads/{uploadId}/complete:
    post:
      tags:
      - Media
      summary: Finalise an upload
      description: The server recomputes SHA-256 and rejects a mismatch with CONFLICT.
      operationId: completeMediaUpload
      parameters:
      - name: uploadId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Upload complete.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
