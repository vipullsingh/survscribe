    DispatchStatus:
      type: string
      enum:
      - PENDING
      - QUEUED
      - SENT
      - DELIVERED
      - FAILED
      description: PostgreSQL enum `dispatch_status`.
    DisposalMode:
      type: string
      enum:
      - RETAINED_BY_INSURED
      - SOLD_TO_SCRAP_BUYER
      - INSURER_TENDER
      description: PostgreSQL enum `disposal_mode`.
    DocumentType:
      type: string
      enum:
      - APPOINTMENT_LETTER
      - POLICY_SCHEDULE
      - CLAIM_INTIMATION
      - PURCHASE_INVOICE
      - BILL_OF_ENTRY
      - DELIVERY_CHALLAN
      - FIXED_ASSET_REGISTER
      - STOCK_LEDGER
      - STOCK_STATEMENT
      - PRODUCTION_LOG
      - GST_RETURN
      - AUDITED_BALANCE_SHEET
      - HYPOTHECATION_LEASE_MORTGAGE
      - FIR_POLICE_DIARY
      - FIRE_BRIGADE_REPORT
      - WEATHER_IMD_REPORT
      - FACTORY_LOGBOOK
      - CCTV_NOTE
      - WITNESS_STATEMENT
      - FORENSIC_ENGINEER_REPORT
      - CLAIM_BILL
      - REPAIR_ESTIMATE
      - OEM_QUOTATION
      - SALVAGE_OFFER
      - SALVAGE_SALE_INVOICE
      - PAYMENT_PROOF
      - PRESERVATION_NOTICE
      - REQUISITION_NOTICE
      - PSR_DOCX
      - FSR_DOCX
      - SURVEYOR_SIGNATURE
      - OTHER
